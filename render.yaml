services:
  - type: web
    name: airplane-quran-reels-bot
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DAILY_GENERATION_COUNT
        value: "10"
      - key: MIN_DURATION_SECONDS
        value: "15"
      - key: MAX_DURATION_SECONDS
        value: "90"
      - key: CHANNEL_TAG
        value: "@QuranInTheSky"
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
